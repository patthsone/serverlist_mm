name: Build ServerList

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logic-tests:
    name: A2S tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests (no SDK needed)
        run: |
          g++ -std=c++17 -Wall -Wextra -I. -Isrc tests/a2s_test.cpp src/A2S.cpp -o a2s_test
          ./a2s_test

  build-linux:
    name: Linux x86_64 plugin
    runs-on: ubuntu-22.04
    needs: logic-tests
    # Built on glibc 2.31 (Ubuntu 20.04): a newer toolchain makes the .so require GLIBC_2.32+, which the game server does not have.
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang g++ binutils zip python3 python3-dev python3-pip python3-setuptools

      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 11f7b87f42086acaf1045084607159a57cfffd00
          path: metamod-source
          submodules: recursive

      - name: HL2SDK (cs2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: 5f891c9026230cce0fc0a3fc4b5fef1c467a1385
          path: hl2sdk-root/hl2sdk-cs2
          submodules: recursive

      - name: AMBuild
        run: |
          python3 -m pip install wheel
          python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Configure
        working-directory: plugin
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py \
            --plugin-name ServerList --plugin-alias serverlist \
            --sdks cs2 --targets x86_64 --enable-optimize \
            --mms_path "$GITHUB_WORKSPACE/metamod-source" \
            --hl2sdk-root "$GITHUB_WORKSPACE/hl2sdk-root" \
            --hl2sdk-manifests "$GITHUB_WORKSPACE/plugin/hl2sdk-manifests"
        env:
          CC: clang
          CXX: clang++

      - name: Build
        working-directory: plugin/build
        run: ambuild

      - name: glibc guard
        working-directory: plugin/build/package
        run: |
          max=$(objdump -T addons/ServerList/ServerList.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol version required: GLIBC_$max"
          if [ "$(printf '%s\n' "$max" 2.31 | sort -V | tail -1)" != "2.31" ]; then
            echo "ServerList.so needs glibc newer than 2.31, it will not load on the game server"
            exit 1
          fi

      - name: Zip package
        run: |
          cd plugin/build/package
          zip -r "$GITHUB_WORKSPACE/ServerList-linux.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ServerList-linux
          path: ServerList-linux.zip

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs: build-linux
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ServerList-linux

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ServerList-linux.zip
          generate_release_notes: true

      - name: Release (latest)
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ServerList-linux.zip \
            --target "$GITHUB_SHA" \
            --title "ServerList (latest)" \
            --notes "Automatic build of $GITHUB_SHA"
