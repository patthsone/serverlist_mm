name: Build ServerList

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# The release steps below create GitHub releases, which the default read-only token cannot do.
permissions:
  contents: write

jobs:
  logic-tests:
    name: A2S tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests (no SDK needed)
        run: |
          g++ -std=c++17 -Wall -Wextra -I. -Isrc tests/a2s_test.cpp src/A2S.cpp -o a2s_test
          ./a2s_test

  build-linux:
    name: Linux x86_64 plugin
    runs-on: ubuntu-22.04
    needs: logic-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          # Pinned to the older Metamod the plugins are built and run against (2026-01-22).
          # Newer master headers pull in khook.hpp, which this plugin does not use.
          ref: 11f7b87f42086acaf1045084607159a57cfffd00
          path: metamod-source
          submodules: recursive

      - name: HL2SDK (cs2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          # Same hl2sdk-cs2 revision as the server build (2026-07-09, branch cs2).
          ref: 5f891c9026230cce0fc0a3fc4b5fef1c467a1385
          path: hl2sdk-root/hl2sdk-cs2
          submodules: recursive

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang python3 python3-pip python3-setuptools git
          python3 -m pip install --upgrade pip wheel
          python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Configure
        working-directory: plugin
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py \
            --plugin-name ServerList --plugin-alias serverlist \
            --sdks cs2 --targets x86_64 --enable-optimize \
            --mms_path "$GITHUB_WORKSPACE/metamod-source" \
            --hl2sdk-root "$GITHUB_WORKSPACE/hl2sdk-root" \
            --hl2sdk-manifests "$GITHUB_WORKSPACE/plugin/hl2sdk-manifests"
        env:
          CC: clang
          CXX: clang++

      - name: Build
        working-directory: plugin/build
        run: ambuild

      - name: Zip package
        run: |
          cd plugin/build/package
          zip -r "$GITHUB_WORKSPACE/ServerList-linux.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ServerList-linux
          path: ServerList-linux.zip

      # Tag v* -> a normal versioned release.
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ServerList-linux.zip
          generate_release_notes: true

      # Push to main/master -> one rolling "latest" release: the previous one (and its tag) is removed and
      # recreated on the built commit, so "latest" always holds the newest zip.
      - name: Release (latest)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ServerList-linux.zip \
            --target "$GITHUB_SHA" \
            --title "ServerList (latest)" \
            --notes "Automatic build of $GITHUB_SHA"
